name: build

on:
  push:
    branches: [main]
  pull_request:

# Checks the package imports on every Python it claims to support, runs the
# suite, and builds into something twine will accept. The second one is not hypothetical — the 0.2.1
# release failed on Metadata-Version 2.5, with an error naming metadata when the
# cause was the build backend.
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor in requires-python, and current.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e . build twine pytest
      # Importing the PACKAGE only touches __init__.py, so the 0.2.1 breakage
      # (mcp 2.0 dropped mcp.server.fastmcp) sailed past a green build. Import the
      # SERVER module and build the tool list — that is what `uvx khwan-mcp` does.
      - run: python -c "import khwan_mcp; print(khwan_mcp.__version__)"
      - run: python -c "import khwan_mcp.server as s; print('server ok:', s.mcp.name)"
      - run: python -m pytest -q
      - name: the tools the client will see
        run: |
          python - <<'EOF'
          import asyncio
          from khwan_mcp.server import mcp
          names = [t.name for t in asyncio.run(mcp.list_tools())]
          print("tools:", names)
          assert "khwan_recall" in names and "khwan_remember" in names, names
          EOF
      - run: python -m build
      - run: python -m twine check dist/*
