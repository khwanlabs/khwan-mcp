[project]
name = "khwan-mcp"
version = "0.3.5"
description = "MCP server for Khwan — give Claude (Code / Desktop) or any MCP client a persistent, learning memory: seed a session with recall, remember durable facts. Khwan never runs a model; Claude is your model."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # <2 is load-bearing: mcp 2.0 removed `mcp.server.fastmcp`, which this
    # server imports. 0.2.1 shipped unbounded and every fresh install since
    # mcp 2.0.0 (2026-07-28) died on ModuleNotFoundError at startup.
    "mcp[cli]>=1.2,<2",
    # Same reasoning one dependency down, and this one is ours — which makes an
    # unbounded range worse, not safer: the day khwan cuts a 1.0 with a changed
    # Turn, every fresh install of khwan-mcp breaks at once, including versions
    # already published. The floor stays at 0.1 because it is true — 0.1 through
    # 0.4 all expose the `sources` / `coherence` / `turn_token` / `raw()` surface
    # this server reads; only the missing ceiling was ever the bug.
    "khwan>=0.1,<1",
]

[project.scripts]
khwan-mcp = "khwan_mcp.server:main"

[project.urls]
Homepage = "https://khwan.ai"
Documentation = "https://docs.khwan.ai"
# PyPI renders this as "Source". An MCP server runs on someone's machine with
# their key and reads what they type, so being able to read it before installing
# is the point — and the page offered no route to it.
Repository = "https://github.com/khwanlabs/khwan-mcp"
Issues = "https://github.com/khwanlabs/khwan-mcp/issues"

[build-system]
requires = ["hatchling<1.28"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/khwan_mcp"]
